project:
  pipeline_name: aws-auto-ml-pipeline
  repo_root: /opt/airflow/repo

aws:
  region: us-east-2
  s3_bucket: sagemaker-us-east-2-597936860966

airflow:
  provider: cli
  dag_id: improved_automl_pipeline
  variable_name: automl_pipeline_config
  generated_conf_path: outputs/airflow_dag_conf.json
  # S3 location where Airflow DAG .py files are stored and synced from.
  dag_s3_uri: s3://sagemaker-us-east-2-597936860966/dags/

data:
  # snowflake_sql: execute query_file against Snowflake and stream results to S3.
  source_type: snowflake_sql
  query_file: queries/model-data.sql
  csv_header: true
  csv_infer_schema: true
  raw_uri: s3://sagemaker-us-east-2-597936860966/pipeline/raw/
  etl_uri: s3://sagemaker-us-east-2-597936860966/pipeline/etl/
  feature_uri: s3://sagemaker-us-east-2-597936860966/pipeline/features/
  processed_uri: s3://sagemaker-us-east-2-597936860966/pipeline/processed/
  previous_run_uri: s3://sagemaker-us-east-2-597936860966/pipeline/baseline/
  label_column: is_fraud
  # Static test file has no rolling freshness guarantee — skip stale-data check.
  freshness_column: null
  # Core columns that must always be present in the pulled data.
  expected_columns:
    - bank_transaction_id
    - amount
    - is_fraud
    - user_transaction_time
    - tf_model_score
  # ~3% null — still above 95% non-null threshold.
  mostly_non_null_checks:
    - dv_cardAccountId_time_since_last_transaction_V2:0.95
  range_checks: []
  set_checks: []
  # Stable numeric features to watch for distribution shift between runs.
  drift_columns:
    - amount
    - tf_model_score
    - dv_card_cnt_24h

model:
  model_dir: /opt/airflow/repo/outputs/model
  metrics_dir: /opt/airflow/repo/outputs/metrics
  feature_log_path: /opt/airflow/repo/outputs/feature_log.json
  validation_report_path: /opt/airflow/repo/outputs/model_validation.json
  model_package_group: fraud-transaction-model
  model_artifact_s3_uri: s3://sagemaker-us-east-2-597936860966/model/model.tar.gz
  champion_auc: 0.75
  # Algorithm to use for training. Choices: neural_network, xgboost, lightgbm, random_forest
  algorithm: xgboost
  # Metrics to compute during evaluation and register as model metadata.
  evaluation_metrics:
    - f1
    - precision
    - recall
    - auc
  hyperparameters:
    learning_rate: 0.001
    epochs: 20
    hidden_dim: 128
    batch_size: 256

ecr:
  account_id: "597936860966"
  repository_name: automl-inference
  create_new_repository_per_model: true
  tag: latest
  dockerfile: containers/inference/Dockerfile.inference
  build_context: .
