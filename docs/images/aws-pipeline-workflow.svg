<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AWS ML pipeline workflow</title>
  <desc id="desc">AWS Airflow orchestrates data pull, validation, ETL, feature engineering, preprocessing, training, evaluation, model validation, and model registry, with IAM and CloudWatch across all stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; rx: 18; filter: url(#shadow); }
      .stage { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; rx: 13; }
      .data { fill: #dbeafe; stroke: #3b82f6; }
      .validate { fill: #fef3c7; stroke: #f59e0b; }
      .feature { fill: #dcfce7; stroke: #22c55e; }
      .model { fill: #f5f3ff; stroke: #8b5cf6; }
      .deploy { fill: #fee2e2; stroke: #ef4444; }
      .control { fill: #e2e8f0; stroke: #64748b; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #64748b; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text x="60" y="62" class="title">AWS execution workflow</text>
  <text x="60" y="92" class="subtitle">Airflow coordinates AWS services while IAM controls permissions and CloudWatch observes logs, metrics, alarms, and validation signals.</text>

  <rect x="60" y="128" width="1280" height="86" class="lane control"/>
  <text x="96" y="166" class="label">Cross-cutting controls</text>
  <text x="96" y="190" class="small">IAM least privilege on every service role. CloudWatch metrics emitted by each timed stage plus drift, validation, and model-quality signals.</text>

  <rect x="60" y="250" width="1280" height="400" class="lane"/>
  <text x="96" y="286" class="label">Airflow DAG: improved_automl_pipeline</text>
  <text x="96" y="307" class="small">Runtime values come from dag_run.conf generated by ml.sh from ml_config.yaml.</text>

  <g transform="translate(100 350)">
    <rect width="140" height="74" class="stage data"/>
    <text x="22" y="31" class="label">Pull data</text>
    <text x="22" y="53" class="small">Databricks SQL</text>
  </g>
  <path class="line" d="M240 387 H285"/>

  <g transform="translate(285 350)">
    <rect width="140" height="74" class="stage validate"/>
    <text x="20" y="31" class="label">Schema check</text>
    <text x="20" y="53" class="small">Columns, rows, freshness</text>
  </g>
  <path class="line" d="M425 387 H470"/>

  <g transform="translate(470 350)">
    <rect width="140" height="74" class="stage data"/>
    <text x="24" y="31" class="label">ETL</text>
    <text x="24" y="53" class="small">Spark or Glue</text>
  </g>
  <path class="line" d="M610 387 H655"/>

  <g transform="translate(655 350)">
    <rect width="140" height="74" class="stage validate"/>
    <text x="18" y="31" class="label">Data validation</text>
    <text x="18" y="53" class="small">GE, drift, balance</text>
  </g>
  <path class="line" d="M795 387 H840"/>

  <g transform="translate(840 350)">
    <rect width="156" height="74" class="stage feature"/>
    <text x="18" y="31" class="label">Feature engineer</text>
    <text x="18" y="53" class="small">Auto rules and log</text>
  </g>
  <path class="line" d="M996 387 H1041"/>

  <g transform="translate(1041 350)">
    <rect width="140" height="74" class="stage feature"/>
    <text x="18" y="31" class="label">Feature select</text>
    <text x="18" y="53" class="small">Leakage, nulls, corr</text>
  </g>

  <path class="line" d="M1111 424 V481 H1000"/>

  <g transform="translate(860 444)">
    <rect width="140" height="74" class="stage data"/>
    <text x="20" y="31" class="label">Preprocess</text>
    <text x="20" y="53" class="small">Final matrix</text>
  </g>
  <path class="line" d="M860 481 H815"/>

  <g transform="translate(675 444)">
    <rect width="140" height="74" class="stage model"/>
    <text x="20" y="31" class="label">Train model</text>
    <text x="20" y="53" class="small">PyTorch container</text>
  </g>
  <path class="line" d="M675 481 H630"/>

  <g transform="translate(490 444)">
    <rect width="140" height="74" class="stage validate"/>
    <text x="18" y="31" class="label">Evaluate</text>
    <text x="18" y="53" class="small">Metrics to JSON</text>
  </g>
  <path class="line" d="M490 481 H445"/>

  <g transform="translate(305 444)">
    <rect width="140" height="74" class="stage validate"/>
    <text x="18" y="31" class="label">Model validate</text>
    <text x="18" y="53" class="small">AUC, champion, latency</text>
  </g>
  <path class="line" d="M305 481 H260"/>

  <g transform="translate(100 444)">
    <rect width="160" height="74" class="stage deploy"/>
    <text x="18" y="31" class="label">Register model</text>
    <text x="18" y="53" class="small">SageMaker registry</text>
  </g>

  <rect x="60" y="690" width="1280" height="82" class="lane"/>
  <text x="96" y="725" class="label">Artifacts</text>
  <text x="96" y="750" class="small">S3 stores raw, ETL, feature, processed, baseline, model, metrics, and validation outputs. ECR stores training and inference images.</text>

  <path class="softLine" d="M180 424 V690"/>
  <path class="softLine" d="M540 424 V690"/>
  <path class="softLine" d="M920 518 V690"/>
  <path class="softLine" d="M745 518 V690"/>
  <path class="softLine" d="M180 518 V690"/>
</svg>
