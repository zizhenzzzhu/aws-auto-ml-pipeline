apiVersion: apps/v1
kind: Deployment
metadata:
  name: automl-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automl-inference
  template:
    metadata:
      labels:
        app: automl-inference
    spec:
      serviceAccountName: automl-inference
      containers:
        - name: automl-inference
          image: account-id.dkr.ecr.region.amazonaws.com/automl-inference:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /opt/ml/model
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: automl-inference
spec:
  type: ClusterIP
  selector:
    app: automl-inference
  ports:
    - port: 80
      targetPort: 8000
